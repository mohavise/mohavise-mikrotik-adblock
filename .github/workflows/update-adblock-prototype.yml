name: Update MikroTik Adblock

on:
  workflow_dispatch:
  schedule:
    # 03:30 Asia/Tehran = 00:00 UTC. Runs after the core repo updates.
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-adblock:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build adblock file
        shell: pwsh
        run: ./scripts/build-adblock.ps1

      - name: Commit updated adblock file
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adblock-domains.txt adblock-hosts.txt adblock-domains.rsc
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Update MikroTik adblock list"
          git push
