name: Update MikroTik Adblock

on:
  workflow_dispatch:
  schedule:
    # 03:30 Asia/Tehran = 00:00 UTC. Runs after the core repo updates.
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-mikrotik-adblock
  cancel-in-progress: false

jobs:
  update-adblock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate outputs
        run: bash ./scripts/build-adblock.sh

      - name: Commit updated outputs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            adblock-domains.txt \
            adblock-hosts.txt \
            adblock-domains.rsc \
            mikrotik-combined-domains.txt \
            mikrotik-adblock-domains.txt \
            mikrotik-adult-domains.txt \
            mikrotik-combined-hosts.txt \
            mikrotik-adblock-hosts.txt \
            mikrotik-adult-hosts.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MikroTik adblock lists"
          git pull --rebase origin main
          git push origin HEAD:main
